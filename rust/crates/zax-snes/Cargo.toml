[package]
name = "zax-snes"
description = "The XSnes3D+ SNES core: Mesen 2 driven one frame at a time."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-only"
publish.workspace = true
build = "build.rs"

[dependencies]
# Lua for Mesen's own scripting code, shared with the app's scripts (see build.rs).
mlua-sys = { version = "0.10", features = ["lua54", "vendored"] }
png = "0.17"
zax-engine3d = { path = "../zax-engine3d" }
zax-profiles = { path = "../zax-profiles" }

[build-dependencies]
cc = { version = "1.2", features = ["parallel"] }

[lints]
workspace = true
