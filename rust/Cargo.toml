[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
publish = false

# Used by the crates copied from Xnes3D+.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

# The same rules as Xnes3D+.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# librashader-runtime-wgpu with the naga module handed to wgpu directly (Mega Bezel), see
# vendor/librashader-runtime-wgpu/README.md. Copied from Xnes3D+ with its app.
[patch.crates-io]
librashader-runtime-wgpu = { path = "vendor/librashader-runtime-wgpu" }
