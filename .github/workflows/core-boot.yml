name: Core boot check

# XSnes3D+ step 1: builds Mesen 2's SNES core with our patch, boots the hello test ROM and
# checks its picture (tests/boot_hello.rs), and shows that the shared Xnes3D+ crates build
# here. The boot picture is kept as a workflow artifact. Pictures of real games come from the
# roms repo's snes-preview workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: The test ROM matches its script
        run: |
          python3 tools/make_hello.py "$RUNNER_TEMP/hello.sfc"
          cmp "$RUNNER_TEMP/hello.sfc" tests/roms/hello.sfc

      - name: Rust (the version in rust-toolchain.toml)
        working-directory: rust
        run: rustup show

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: core-boot-${{ hashFiles('rust/Cargo.lock', 'rust/crates/zax-snes/build.rs', 'rust/crates/zax-snes/patches/*', 'rust/crates/zax-snes/cpp/*') }}-${{ hashFiles('.gitmodules') }}
          restore-keys: core-boot-

      - name: Build (Mesen 2 and the shim)
        working-directory: rust
        run: cargo build --release -p zax-snes --bins --tests

      - name: Boot test
        working-directory: rust
        run: cargo test --release -p zax-snes

      - name: Shared Xnes3D+ crates build here
        working-directory: rust
        run: cargo check -p shared-link-check

      - name: Lints
        working-directory: rust
        run: |
          cargo fmt -p zax-snes -p shared-link-check --check
          cargo clippy --release -p zax-snes --all-targets -- -D warnings

      - name: Boot picture
        working-directory: rust
        run: target/release/snes-boot ../tests/roms/hello.sfc --frames 60 --out "$RUNNER_TEMP/boot"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-boot
          path: |
            ${{ runner.temp }}/boot
            rust/Cargo.lock
          if-no-files-found: ignore
