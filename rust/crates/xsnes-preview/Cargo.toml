[package]
name = "xsnes-preview"
description = "Plays a SNES ROM and draws pictures of it: flat, in plain 3D and in Smart 3D."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "snes-preview"
path = "src/main.rs"

[dependencies]
png = "0.17"
zax-engine3d = { path = "../zax-engine3d" }
zax-profiles = { path = "../zax-profiles" }
zax-render = { path = "../zax-render", features = ["offscreen"] }
zax-settings = { path = "../zax-settings" }
zax-snes = { path = "../zax-snes" }

[lints]
workspace = true
